services:
  llama-server:
    build:
      context: ./modules/llama
      dockerfile: Dockerfile
    container_name: jarvis-llama-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - ./models:/models:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health", "||", "exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      - LLAMA_MODEL_PATH=/models
      - LLAMA_PORT=8080

  jarvis-inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jarvis-inference
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    depends_on:
      llama-server:
        condition: service_healthy
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_PORT:-8080}:8080"
    cpus: ${INFERENCE_CPUS:-0.4}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-1g}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      INFERENCE_BACKEND: llamacpp
      INFERENCE_HOST: 0.0.0.0
      LLAMACPP_MANAGED: "true"
      LLAMACPP_HOST: llama-server
      LLAMACPP_PORT: "8080"
      INFERENCE_PORT: "8080"
      # llama.cpp managed backend (set INFERENCE_BACKEND=llamacpp and provide
      # the native binary + GGUF location, e.g. INFERENCE_BACKEND=llamacpp,
      # LLAMACPP_SERVER=/usr/local/bin/llama-server, LLAMACPP_MODEL=/models/<model>.gguf,
      # LLAMACPP_ALIAS=<alias>, MODEL_REGISTRY=<alias>, DEFAULT_MODEL=<alias>,
      # MEMORY_BUDGET_GB=<n>, LLAMACPP_CACHE_TYPE_K=q8_0, LLAMACPP_CACHE_TYPE_V=q8_0,
      # LLAMACPP_FLASH_ATTENTION=true). Mount the GGUF directory, for example:
      #   volumes:
      #     - ./models:/models:ro
      # Ollama backend (default): model store lives in the `ollama` volume.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
services:
  llama-server:
    build:
      context: ./modules/llama
      dockerfile: Dockerfile
    container_name: jarvis-llama-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - LLAMA_MODEL_PATH=/models
      - LLAMA_ALIAS=${LLAMACPP_ALIAS:-default-model}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  jarvis-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-inference
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    depends_on:
      llama-server:
        condition: service_healthy
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_PORT:-8080}:8080"
    cpus: ${INFERENCE_CPUS:-0.4}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-1g}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      INFERENCE_BACKEND: llamacpp
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: "8080"
      # llama-server runs as a separate container, so the gateway connects over HTTP
      # instead of spawning its own managed llama-server process.
      LLAMACPP_MANAGED: "false"
      LLAMACPP_URL: http://llama-server:8080
      LLAMACPP_HOST: llama-server
      LLAMACPP_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
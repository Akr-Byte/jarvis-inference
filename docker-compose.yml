services:
  llama-server:
    build:
      context: ./modules/llama
      dockerfile: Dockerfile
    container_name: jarvis-llama-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      # The engine has no authentication. Keep it on loopback; clients use the
      # authenticated gateway on 8080.
      - "${LLAMACPP_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    volumes:
      # MODEL_DIRECTORY may be an absolute path or ~/...; Compose expands ~ to the host home.
      - ${MODEL_DIRECTORY:-./models}:/models:ro
    cpus: ${LLAMACPP_THREADS:-8}
    mem_limit: ${MEMORY_BUDGET_GB:-10}g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      - LLAMA_MODEL_PATH=/models
      # Set LLAMA_MODEL in the environment to pin a specific mounted GGUF.
      - LLAMA_MODEL=${LLAMA_MODEL:-}
      - LLAMA_ALIAS=${LLAMACPP_ALIAS:-default-model}
      - LLAMA_CTX_SIZE=${MAX_CONTEXT_LENGTH:-16384}
      - LLAMACPP_PARALLEL=${LLAMACPP_PARALLEL:-1}
      # Match the engine container's CPU quota so llama.cpp does not spawn
      # threads for host cores the container cannot use.
      - LLAMACPP_THREADS=${LLAMACPP_THREADS:-8}
      - LLAMACPP_BATCH_THREADS=${LLAMACPP_BATCH_THREADS:-8}
      - LLAMACPP_BATCH_SIZE=${LLAMACPP_BATCH_SIZE:-}
      - LLAMACPP_UBATCH_SIZE=${LLAMACPP_UBATCH_SIZE:-}
      - LLAMACPP_GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-}
      - LLAMACPP_CACHE_PROMPT=${LLAMACPP_CACHE_PROMPT:-}
      - LLAMACPP_CACHE_RAM_MIB=${LLAMACPP_CACHE_RAM_MIB:-}
      - LLAMACPP_CACHE_REUSE=${LLAMACPP_CACHE_REUSE:-}
      - LLAMACPP_CACHE_TYPE_K=${LLAMACPP_CACHE_TYPE_K:-}
      - LLAMACPP_CACHE_TYPE_V=${LLAMACPP_CACHE_TYPE_V:-}
      - LLAMACPP_FLASH_ATTENTION=${LLAMACPP_FLASH_ATTENTION:-}
      - LLAMACPP_JINJA=${LLAMACPP_JINJA:-}
      - LLAMACPP_METRICS=${LLAMACPP_METRICS:-}
      - LLAMACPP_MLOCK=${LLAMACPP_MLOCK:-}
      - LLAMACPP_REASONING_FORMAT=${LLAMACPP_REASONING_FORMAT:-}
      - LLAMACPP_DRAFT_MODEL=${LLAMACPP_DRAFT_MODEL:-}
      - LLAMACPP_DRAFT_MAX_LEN=${LLAMACPP_DRAFT_MAX_LEN:-}
      - LLAMACPP_DRAFT_MIN_LEN=${LLAMACPP_DRAFT_MIN_LEN:-}
      - LLAMACPP_DRAFT_CTX_SIZE=${LLAMACPP_DRAFT_CTX_SIZE:-}
      - LLAMA_EXTRA_ARGS=${LLAMA_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  jarvis-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-inference
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    depends_on:
      llama-server:
        condition: service_healthy
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_PORT:-8080}:8080"
    cpus: ${INFERENCE_CPUS:-0.4}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-1g}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      INFERENCE_BACKEND: llamacpp
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: "8080"
      # llama-server runs as a separate container, so the gateway connects over HTTP
      # instead of spawning its own managed llama-server process.
      LLAMACPP_MANAGED: "false"
      LLAMACPP_URL: http://llama-server:8080
      LLAMACPP_HOST: llama-server
      LLAMACPP_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
